name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/jiya:${{ github.sha }} .

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/jiya:${{ github.sha }}

    - name: Update deployment image
      run: |
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/jiya:${{ github.sha }}|g" k8s/deployment.yaml
        git add k8s/deployment.yaml
        git commit -m ${{ github.sha }}
        git push



