apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-c
  labels:
    app: project-c
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-c
  template:
    metadata:
      labels:
        app: project-c
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: project-c
          image: jiya1/jiya:f8dd3eed171cdb6e7010e0f78c8b3489d93a38d4
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

